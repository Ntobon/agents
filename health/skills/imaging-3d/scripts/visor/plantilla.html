<!--
VISOR 3D GENÉRICO · plantilla de la skill imagenes-3d (scripts/visor/plantilla.html)
====================================================================================
No se edita a mano por caso: armar_visor.py la llena con la configuración (visor.json), el GLB,
las pestañas, el glosario y el video. Todo lo del caso vive en esos archivos, nunca aquí.

Marcadores que reemplaza armar_visor.py (cada uno aparece una sola vez en el cuerpo): el título de la
página; los comentarios HTML CABECERA, NAV, POSTER, EXPLORAR_EXTRA, SIN_JS, PANELES y PIE (con doble
guion bajo a cada lado); CONFIG_JSON dentro del script de configuración; GLB_B64 dentro del script del modelo.

Coordenadas (scripts/coords.py): glTF con +Y arriba, 1 unidad = 1 cm, +X = izquierda del paciente
(derecha de la pantalla en la vista de frente), +Z = hacia adelante (hacia quien mira de frente).
Los nodos del GLB se llaman con la clave ASCII de cada estructura y no traen materiales: el visor
los colorea desde la configuración.

ESQUEMA DE LA CONFIGURACIÓN (todo opcional salvo "estructuras"; textos en texto plano)
  titulo, subtitulo, eyebrow, banner, pie        textos de la cabecera y del pie
  <campo>_compartir                              variante de esos textos para la copia compartida
  prefijo_storage                                prefijo de localStorage (tema, pestaña, capas)
  explorar_titulo                                rótulo de la primera pestaña (por defecto «Explorar»)
  estructuras[]  {k, n, c, a, g, d, con, emis, orden, oculta, leyenda, tubo}
      k clave = nombre del nodo del GLB · n nombre · c color hex sRGB · a opacidad 0-1 · g grupo
      d descripción de una línea (leyenda) · con = clave de otra estructura: se prende y apaga con el chip de esa
      emis color emisivo opcional · orden renderOrder manual · oculta: solo aparece en los modos
      que la listan en «mostrar» · leyenda:false la saca de la leyenda de colores
      tubo {desde, hasta, radio} (sobre la ruta) o {puntos[], radio}: estructura DIBUJADA, no del GLB
  grupos[] {id, n}                               orden y rótulo de los grupos de chips y de la leyenda
  foco_ocultar[]                                 claves que se apagan en «Solo lo importante» y en los
                                                 modos o flujos con foco (p. ej. piel, hueso)
  vistas {id: {n, dir[3], objetivo, radio, foco, boton}} cámara: dirección desde el objetivo; objetivo =
                                                 [x,y,z] | clave | "ruta:N"; radio = esfera a encuadrar;
                                                 boton:false = vista solo para modos y flujos
  vista_inicial
  hotspots[] {n, t, d, p, k, color, desplazar[3], por_modo{modo: {t,d} | false}}
      p = [x,y,z] | clave (centro de su caja) | "ruta:N" · k = estructura a la que pertenece: el
      punto se oculta cuando esa estructura no está · por_modo cambia el texto (y lo fuerza visible)
      o lo oculta (false) en un modo
  modos[] {id, n, grupo, leyenda, mostrar[], ocultar[], opacidad{k: a}, vista, foco, puntos,
           modulo, secuencia, opcion, fase}
      modulo: "normal" (sin la lesión) | "etapas" (secuencia animada) | "reseccion" (opcion + fase
      "saca"|"queda") · puntos:false oculta los hotspots · foco:true apaga foco_ocultar mientras dure
  modo_inicial
  ruta {puntos[[x,y,z]], radios[] (cm, luz), vel, zonas[{desde,hasta,vel}],
        estrechez{desde, hasta, vel, luz_normal, pared_normal, color_normal, clave}}
      (armar_visor.py acepta además «archivo»: ruta.json con radios_mm, y «suavizado»)
      luz_normal / pared_normal: número o lista por punto entre desde y hasta
  flujo {titulo, liquido{n,tam,esp,color,etiqueta}, solido{n,tam[2],esp,color,frag,frag_color,
         tam_min,etiqueta}, textos{liquido, solido, liquido_normal, solido_normal, post},
         vista, opacidad{k:a}, foco, vel_post}
  secuencias {id: [etapa]}   etapa = {t, luz, pared, color, desde, hasta, escala{k: factor}}
                             o la forma corta {tipo:"escala", clave, factor, t}
  seg_etapa (segundos por etapa, 6.5 por defecto: las etapas rápidas no se alcanzan a leer)
  reseccion {color_saca, color_ganglios, radio_ganglio, ganglios[p],
             opciones{id: {n, saca[], planos[{claves[], queda[{punto,normal} | {ruta, queda:"antes"|"despues"}]}],
                           ocultar_queda[], ganglios[p], reconstruccion[{puntos[p], radio, color, a}],
                           uniones[p], post_ruta{puntos[p], radio}, texto_post}}}
      saca: estructuras que salen completas (rojas en «saca», ausentes en «queda») · planos: cada
      estructura listada se corta; queda = unión de los semiespacios que se conservan; lo demás sale
      · ocultar_queda: lo que ya no existe después (aire o luz del tramo quitado, la lesión)
      · puntos p = [x,y,z] | clave | "ruta:N" | "ruta:A-B" (rango, solo en listas)
  orientacion (true por defecto: rótulos «derecha / izquierda del paciente»)
  pestanas_privadas[]  (las usa armar_visor.py para la copia compartida)
-->

<script>
(function () {
  'use strict';

  // =====================================================================
  // 0. Configuración y utilidades
  // =====================================================================
  var CFG = {};
  try { CFG = JSON.parse(document.getElementById('config-visor').textContent || '{}') || {}; } catch (e) { CFG = {}; }
  var P = String(CFG.prefijo_storage || 'visor3d') + '-';
  var vis = {};          // ganchos del 3D; se llenan cuando carga el modelo
  var pendiente = null;  // modo o flujo pedido antes de que el modelo terminara de cargar
  function $(id) { return document.getElementById(id); }
  function arr(x) { return Array.isArray(x) ? x : (x == null ? [] : [x]); }
  function num(x, d) { return typeof x === 'number' && isFinite(x) ? x : d; }
  function leer(k, d) { try { var v = localStorage.getItem(P + k); return v === null ? d : v; } catch (e) { return d; } }
  function guardar(k, v) { try { localStorage.setItem(P + k, v); } catch (e) {} }
  function el(tag, cls, txt) { var x = document.createElement(tag); if (cls) x.className = cls; if (txt != null) x.textContent = txt; return x; }

  // =====================================================================
  // 1. Tema: claro por defecto, toggle visible y persistente
  // =====================================================================
  var btnTema = $('btn-tema');
  function setTema(t) {
    t = t === 'dark' ? 'dark' : 'light';
    document.documentElement.dataset.theme = t;
    guardar('tema', t);
    if (btnTema) btnTema.textContent = t === 'dark' ? '☀' : '☾';

  // =====================================================================
  // 12. Motor de modos: visibilidad, opacidades y leyenda

  function leyenda(t) {

    if (m && m.modulo === 'reseccion' && RES[m.opcion]) {

  function refrescar() {
    if (!listo) return;
    PRESENTE = {};
    E.forEach(function (e) {
      var v = visibleEstructura(e.k);
      (MALLAS[e.k] || []).forEach(function (m) { m.visible = v; });
      if (v) PRESENTE[e.k] = true;
      var op = opacidadDe(e.k);

    });

    Object.keys(RES).forEach(function (id) {
      var R = RES[id], act = !!(modoAct && modoAct.modulo === 'reseccion' && modoAct.opcion === id), fase = act ? (modoAct.fase || 'saca') : '';

  var vec = new V3();

<script>
// =====================================================================
// Glosario con tooltips (script aparte: funciona aunque falle el 3D).
// <dl id="dicc"> es la fuente única; envuelve cada aparición de cada alias.
// =====================================================================
(function () {
  try {
    var defs = [];
    document.querySelectorAll('#dicc > div').forEach(function (r) {
      var dt = r.querySelector('dt'), dd = r.querySelector('dd');
      if (!dt || !dd) return;
      String(r.dataset.terms || dt.textContent).split('|').forEach(function (a) { a = a.trim(); if (a) defs.push({ a: a, t: dt.textContent, d: dd.textContent }); });
    });
    if (!defs.length) return;
    defs.sort(function (x, y) { return y.a.length - x.a.length; });
    var esc = function (s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); };
    var re = new RegExp('(^|[^\\p{L}\\p{N}])(' + defs.map(function (x) { return esc(x.a); }).join('|') + ')(?![\\p{L}\\p{N}])', 'giu');
    var mapa = {}; defs.forEach(function (x) { mapa[x.a.toLowerCase()] = x; });
    var SKIP = { A: 1, SCRIPT: 1, STYLE: 1, H1: 1, NAV: 1, BUTTON: 1, DT: 1, DD: 1, LABEL: 1, VIDEO: 1, NOSCRIPT: 1, svg: 1, SVG: 1 };
    function recorrer(nodo, out) {
      for (var n = nodo.firstChild; n; n = n.nextSibling) {
        if (n.nodeType === 3) out.push(n);
        else if (n.nodeType === 1 && !SKIP[n.tagName] && !n.classList.contains('gl') && !n.classList.contains('mono') &&
                 !n.classList.contains('stage') && !n.classList.contains('no-glosario') && n.id !== 'modos') recorrer(n, out);
      }
      return out;
    }
    document.querySelectorAll('.panel').forEach(function (p) {
      if (p.id === 'panel-glosario') return;
      recorrer(p, []).forEach(function (tn) {
        var s = tn.nodeValue, frag = document.createDocumentFragment(), last = 0, m, hit = false;
        re.lastIndex = 0;
        while ((m = re.exec(s))) {
          var st = m.index + m[1].length, d = mapa[m[2].toLowerCase()];
          if (!d) continue;
          frag.appendChild(document.createTextNode(s.slice(last, st)));
          var sp = document.createElement('span'); sp.className = 'gl'; sp.tabIndex = 0; sp.textContent = m[2];
          sp.dataset.t = d.t; sp.dataset.d = d.d; frag.appendChild(sp);
          last = st + m[2].length; hit = true;
        }
        if (hit) { frag.appendChild(document.createTextNode(s.slice(last))); tn.parentNode.replaceChild(frag, tn); }
      });
    });
    var tip = document.getElementById('tip'), abierto = null;
    function mostrar(el) {
      tip.innerHTML = '<b></b><span></span>'; tip.firstChild.textContent = el.dataset.t; tip.lastChild.textContent = el.dataset.d;
      tip.style.display = 'block';
      var r = el.getBoundingClientRect(), w = tip.offsetWidth;
      tip.style.left = Math.max(12, Math.min(window.scrollX + r.left, window.scrollX + document.documentElement.clientWidth - w - 12)) + 'px';
      tip.style.top = (window.scrollY + r.bottom + 8) + 'px'; abierto = el;
    }
    function ocultar() { tip.style.display = 'none'; abierto = null; }
    document.addEventListener('click', function (ev) {
      var el = ev.target.closest && ev.target.closest('.gl');
      if (el) { ev.preventDefault(); if (abierto === el) ocultar(); else mostrar(el); return; }
      ocultar();
    });
    document.addEventListener('mouseover', function (ev) { var el = ev.target.closest && ev.target.closest('.gl'); if (el && matchMedia('(hover: hover)').matches) mostrar(el); });
    document.addEventListener('mouseout', function (ev) { var el = ev.target.closest && ev.target.closest('.gl'); if (el && matchMedia('(hover: hover)').matches) ocultar(); });
    document.addEventListener('keydown', function (ev) {
      if (ev.key === 'Escape') ocultar();
      if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.classList && ev.target.classList.contains('gl')) { ev.preventDefault(); mostrar(ev.target); }
    });
    window.addEventListener('scroll', ocultar, { passive: true });
  } catch (e) {}
})();
